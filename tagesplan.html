<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tagesplan – Gebr. Estermann AG</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #111318;
    --surface: #1a1d25;
    --sur2:    #222630;
    --border:  rgba(255,255,255,0.07);
    --text:    #e2e6f0;
    --dim:     #5a6078;
    --accent:  #4f8ef7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 960px;
    min-height: 1080px;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    overflow-x: hidden;
  }

  .page { display: flex; flex-direction: column; min-height: 1080px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 20px;
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    flex-shrink: 0;
  }
  .logo { display: flex; align-items: center; gap: 9px; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 7px var(--accent); animation: pulse 2.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.6)} }
  .date-block { text-align: center; }
  .woche { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
  .datum { font-size: 17px; font-weight: 700; font-family: 'Barlow Condensed', sans-serif; letter-spacing: .02em; }
  .clock { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; color: var(--dim); min-width: 75px; text-align: right; letter-spacing: .05em; }

  .col-headers { display: grid; grid-template-columns: 155px 1fr 1fr; padding: 7px 14px 5px; border-bottom: 1px solid var(--border); gap: 4px; }
  .col-header { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); padding: 0 8px; }
  .col-header.vm { color: #e09030; }
  .col-header.nm { color: #4f8ef7; }

  .scroll { flex: 1; overflow-y: auto; padding: 5px 14px 14px; scrollbar-width: thin; scrollbar-color: #2a2f45 transparent; }

  .row { display: grid; grid-template-columns: 155px 1fr 1fr; gap: 4px; margin-bottom: 4px; animation: fadeIn .3s ease both; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

  .name-cell { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 7px; padding: 7px 9px; min-height: 50px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0; background: var(--sur2); color: var(--dim); border: 1px solid var(--border); font-family: 'Barlow Condensed', sans-serif; }
  .nm-text .sn { font-weight: 700; font-size: 14px; line-height: 1.2; }
  .nm-text .fn { font-size: 11px; color: var(--dim); }

  .slot { display: flex; flex-direction: column; gap: 3px; min-height: 50px; }

  .badge { flex: 1; border-radius: 6px; padding: 5px 9px; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; min-height: 48px; }
  .badge::after { content:''; position:absolute; inset:0; background:rgba(255,255,255,.06); border-radius:inherit; pointer-events:none; }
  .vm .badge { border-left: 3px solid rgba(224,144,48,.55); }
  .nm .badge { border-left: 3px solid rgba(79,142,247,.55); }
  .badge-mark { font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; opacity: .85; margin-bottom: 2px; font-family: 'Barlow Condensed', sans-serif; }
  .badge-bez  { font-size: 13px; font-weight: 700; line-height: 1.2; }
  .badge-adr  { font-size: 11px; opacity: .78; line-height: 1.2; }
  .badge-note { font-size: 11px; opacity: .72; margin-top: 2px; line-height: 1.3; white-space: pre-line; font-style: italic; }
  .empty { border-radius: 6px; min-height: 48px; background: rgba(255,255,255,.02); border: 1px dashed rgba(255,255,255,.05); }

  /* ═══════════════════════════════════════════════════
     MARKIERUNG-FARBEN – exakt nach Visual Planning
     Helle Originalfarben werden für dunkles Theme angepasst
     ═══════════════════════════════════════════════════ */

  /* Gelb */
  .m-anzeichnen-lueftung   { background: #a08800; color: #fff8cc; }
  /* Dunkelblau */
  .m-anzeichnen-sanitaer   { background: #1a3a8a; color: #c8d8ff; }
  /* Hellgrün */
  .m-baus-arbeiten         { background: #3a7a3a; color: #d0ffd0; }
  /* Orange */
  .m-bodenheizung          { background: #c06000; color: #ffe0b0; }
  /* Hellgelb (gedimmt) */
  .m-einlagen-lueftung     { background: #7a7200; color: #fffacc; }
  /* Hellblau */
  .m-einlagen-sanitaer     { background: #1a5a8a; color: #c8e8ff; }
  /* Dunkelrot mit Muster */
  .m-erdsondenleitung      { background: repeating-linear-gradient(45deg,#6a101033,#6a101033 5px,#8a151533 5px,#8a151533 10px); border:1px solid #8a1515; color:#ffcccc; }
  /* Lila mit Muster */
  .m-ferien                { background: repeating-linear-gradient(45deg,#7a10aa33,#7a10aa33 5px,#9910cc22 5px,#9910cc22 10px); border:1px dashed #bb30cc; color:#f0b0ff; }
  /* Dunkelrot */
  .m-fertigmontage-heizung { background: #8a1515; color: #fff; }
  /* Lachs/Rosa */
  .m-fertigmontage-lueftung{ background: #c06060; color: #fff; }
  /* Schwarz */
  .m-fertigmontage-sanitaer{ background: #2a2e38; color: #fff; border: 1px solid #444; }
  /* Rosa */
  .m-heizungssanierung     { background: #aa3060; color: #ffd0e0; }
  /* Lachs */
  .m-kellervert-heizung    { background: #c06060; color: #fff; }
  /* Grau mit Muster */
  .m-kellervert-sanitaer   { background: repeating-linear-gradient(45deg,#44484e33,#44484e33 5px,#55595f33 5px,#55595f33 10px); border:1px solid #666; color:#ddd; }
  /* Grau */
  .m-kompensation          { background: #555a66; color: #ddd; }
  /* Rot */
  .m-rohmontage-heizung    { background: #aa2020; color: #fff; }
  /* Gelb */
  .m-rohmontage-lueftung   { background: #907800; color: #fff8cc; }
  /* Hellblau */
  .m-rohmontage-sanitaer   { background: #1a5888; color: #c8e4ff; }
  /* Pink/Magenta */
  .m-service               { background: #c4127e; color: #fff; }
  /* Türkis */
  .m-umbau                 { background: #1e6868; color: #c8f0f0; }
  /* Hellgrün */
  .m-vorfabrizieren        { background: #4a7a1a; color: #d8ffb0; }
  /* Grün */
  .m-wannen-setzen         { background: #2a7a2a; color: #ccffcc; }
  /* Peach/Braun */
  .m-werkstatt             { background: #a06020; color: #ffe0b0; }
  /* Diverses */
  .m-lieferung             { background: #3a6a9a; color: #c8e0ff; }
  .m-personalverleih       { background: #7a4a9a; color: #e8d0ff; }
  .m-wasserversorgung      { background: #1a5a7a; color: #b0e0f8; }
  .m-zivilschutz           { background: repeating-linear-gradient(45deg,#2a2e3833,#2a2e3833 5px,#33374433 5px,#33374433 10px); border:1px solid #555; color:#bbb; }
  .m-default               { background: #1e3a5a; color: #b0ccee; }

  footer { flex-shrink: 0; padding: 7px 22px; font-size: 10px; color: var(--dim); display: flex; justify-content: space-between; border-top: 1px solid var(--border); background: var(--surface); letter-spacing: .04em; }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="logo"><div class="dot"></div>Gebr. Estermann AG</div>
    <div class="date-block">
      <div class="woche" id="woche">–</div>
      <div class="datum" id="datum">–</div>
    </div>
    <div class="clock" id="clock">–</div>
  </header>

  <div class="col-headers">
    <div class="col-header">Mitarbeiter</div>
    <div class="col-header vm">☀ Vormittag</div>
    <div class="col-header nm">◑ Nachmittag</div>
  </div>

  <div class="scroll">
    <div id="planBody">
      <div style="text-align:center;padding:60px;color:var(--dim)">⏳ Wird geladen…</div>
    </div>
  </div>

  <footer>
    <span id="updated">–</span>
    <span>Visual Planning · Auto-Refresh alle 5 Min.</span>
  </footer>

</div>
<script>
const JSON_URL = window.TAGESPLAN_JSON_URL
  || new URLSearchParams(location.search).get('json')
  || 'Tagesansicht.json';
const REFRESH_MS = 5 * 60 * 1000;

// Slot-Logik
function getSlot(r) {
  const st = (r['Startzeit'] || '00:00').trim();
  const et = (r['Endzeit']   || '00:00').trim();
  if (st === '00:00' && et === '12:00') return 'vm';
  if (st === '12:00' && et === '00:00') return 'nm';
  return 'both';
}

// Markierung → CSS-Klasse (exakt nach Visual Planning Liste)
function markClass(m) {
  const t = (m || '').toLowerCase().trim();
  if (t === 'anzeichnen lüftung')        return 'm-anzeichnen-lueftung';
  if (t === 'anzeichnen sanitär')        return 'm-anzeichnen-sanitaer';
  if (t === 'baus. arbeiten')            return 'm-baus-arbeiten';
  if (t === 'bodenheizung')              return 'm-bodenheizung';
  if (t === 'einlagen lüftung')          return 'm-einlagen-lueftung';
  if (t === 'einlagen sanitär')          return 'm-einlagen-sanitaer';
  if (t === 'erdsondenleitung')          return 'm-erdsondenleitung';
  if (t === 'ferien')                    return 'm-ferien';
  if (t === 'fertigmontage heizung')     return 'm-fertigmontage-heizung';
  if (t === 'fertigmontage lüftung')     return 'm-fertigmontage-lueftung';
  if (t === 'fertigmontage sanitär')     return 'm-fertigmontage-sanitaer';
  if (t === 'heizungssanierung')         return 'm-heizungssanierung';
  if (t === 'kellerverteilung heizung')  return 'm-kellervert-heizung';
  if (t === 'kellerverteilung sanitär')  return 'm-kellervert-sanitaer';
  if (t === 'kompensation')              return 'm-kompensation';
  if (t === 'lieferung')                 return 'm-lieferung';
  if (t === 'personalverleih')           return 'm-personalverleih';
  if (t === 'rohmontage heizung')        return 'm-rohmontage-heizung';
  if (t === 'rohmontage lüftung')        return 'm-rohmontage-lueftung';
  if (t === 'rohmontage sanitär')        return 'm-rohmontage-sanitaer';
  if (t === 'service')                   return 'm-service';
  if (t === 'umbau')                     return 'm-umbau';
  if (t === 'vorfabrizieren')            return 'm-vorfabrizieren';
  if (t === 'wannen setzen')             return 'm-wannen-setzen';
  if (t.includes('werkstatt') || t.includes('lager')) return 'm-werkstatt';
  if (t === 'wasserversorgung')          return 'm-wasserversorgung';
  if (t === 'zivilschutz')              return 'm-zivilschutz';
  return 'm-default';
}

// Badge HTML
function badgeHtml(r) {
  const mark = (r['Markierung']  || '').trim();
  const bez  = (r['Bezeichnung'] || '').trim();
  const adr  = (r['Adresse']     || '').trim();
  let notiz  = (r['Notiz']       || '').trim();
  if (notiz.startsWith('VPEXPORT:')) notiz = '';
  const cls  = markClass(mark || notiz);
  return `<div class="badge ${cls}">
    ${mark  ? `<span class="badge-mark">${x(mark)}</span>`  : ''}
    ${bez   ? `<span class="badge-bez">${x(bez)}</span>`    : ''}
    ${adr   ? `<span class="badge-adr">${x(adr)}</span>`    : ''}
    ${notiz ? `<span class="badge-note">${x(notiz)}</span>` : ''}
  </div>`;
}

// Gruppieren
function group(records) {
  const map = new Map();
  records.forEach(r => {
    const vn = (r['Vorname'] || '').trim();
    const nn = (r['Name']    || '').trim();
    if (!vn && !nn) return;
    const key = `${nn}__${vn}`;
    if (!map.has(key)) map.set(key, { nn, vn, vm: [], nm: [] });
    const emp  = map.get(key);
    const slot = getSlot(r);
    if (slot === 'vm'   || slot === 'both') emp.vm.push(r);
    if (slot === 'nm'   || slot === 'both') emp.nm.push(r);
  });
  return [...map.values()].sort((a, b) =>
    (a.nn || a.vn).localeCompare(b.nn || b.vn, 'de'));
}

// Render
function render(records) {
  const emps = group(records);
  const body = document.getElementById('planBody');
  body.innerHTML = '';
  if (!emps.length) {
    body.innerHTML = `<div style="text-align:center;padding:60px;color:var(--dim)">📭 Keine Einträge für heute</div>`;
    return;
  }
  emps.forEach((emp, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.animationDelay = `${i * 28}ms`;
    const ini    = ((emp.nn?.[0]||'') + (emp.vn?.[0]||'')).toUpperCase();
    const vmHtml = emp.vm.length ? emp.vm.map(badgeHtml).join('') : `<div class="empty"></div>`;
    const nmHtml = emp.nm.length ? emp.nm.map(badgeHtml).join('') : `<div class="empty"></div>`;
    row.innerHTML = `
      <div class="name-cell">
        <div class="avatar">${x(ini)}</div>
        <div class="nm-text">
          <div class="sn">${x(emp.nn || emp.vn)}</div>
          <div class="fn">${x(emp.nn ? emp.vn : '')}</div>
        </div>
      </div>
      <div class="slot vm">${vmHtml}</div>
      <div class="slot nm">${nmHtml}</div>`;
    body.appendChild(row);
  });
  const n = new Date();
  document.getElementById('updated').textContent =
    `Aktualisiert: ${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
}

// Laden
async function load() {
  try {
    const url  = JSON_URL + (JSON_URL.includes('?') ? '&' : '?') + '_t=' + Date.now();
    const res  = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    render(Array.isArray(data) ? data : []);
  } catch(err) {
    document.getElementById('planBody').innerHTML =
      `<div style="text-align:center;padding:60px;color:var(--dim)">⚠️ Ladefehler: ${x(err.message)}</div>`;
  }
}

function p(n) { return String(n).padStart(2,'0'); }
function x(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function tick() {
  const n = new Date();
  document.getElementById('clock').textContent = `${p(n.getHours())}:${p(n.getMinutes())}`;
}
function updateDate() {
  const d = new Date();
  const days   = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  const months = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const t = new Date(d); t.setHours(0,0,0,0);
  t.setDate(t.getDate() + 3 - (t.getDay()+6)%7);
  const w1   = new Date(t.getFullYear(), 0, 4);
  const week = 1 + Math.round(((t - w1) / 86400000 - 3 + (w1.getDay()+6)%7) / 7);
  document.getElementById('woche').textContent = `KW ${week} · ${d.getFullYear()}`;
  document.getElementById('datum').textContent  =
    `${days[d.getDay()]}, ${d.getDate()}. ${months[d.getMonth()]}`;
}

updateDate(); tick();
setInterval(tick, 1000);
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
