<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tagesplan – Gebr. Estermann AG</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #111318;
    --surface: #1a1d25;
    --sur2:    #222630;
    --border:  rgba(255,255,255,0.07);
    --text:    #e2e6f0;
    --dim:     #5a6078;
    --accent:  #4f8ef7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 960px;
    height: 1080px;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    overflow: hidden;
  }

  .page {
    display: flex;
    flex-direction: column;
    height: 1080px;
  }

  /* HEADER */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    flex-shrink: 0;
  }
  .logo { display: flex; align-items: center; gap: 9px; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 7px var(--accent); animation: pulse 2.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.6)} }
  .date-block { text-align: center; }
  .woche { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
  .datum { font-size: 18px; font-weight: 700; font-family: 'Barlow Condensed', sans-serif; }
  .clock { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 700; color: var(--dim); min-width: 80px; text-align: right; }

  /* COLUMN HEADERS */
  .col-headers {
    display: grid;
    grid-template-columns: 170px 1fr 1fr;
    padding: 6px 12px 5px;
    border-bottom: 1px solid var(--border);
    gap: 4px;
    flex-shrink: 0;
  }
  .col-header { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); padding: 0 8px; }
  .col-header.vm { color: #e09030; }
  .col-header.nm { color: #4f8ef7; }

  /* TABLE BODY – fills remaining height */
  .table-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 6px 12px;
    gap: 4px;
    overflow: hidden;
  }

  /* ROW – equal height, fills full table */
  .row {
    display: grid;
    grid-template-columns: 170px 1fr 1fr;
    gap: 4px;
    flex: 1;   /* all rows share height equally */
    min-height: 0;
    animation: fadeIn .3s ease both;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

  /* NAME CELL */
  .name-cell {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface);
    border-radius: 8px;
    padding: 8px 11px;
  }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; flex-shrink: 0;
    background: var(--sur2); color: var(--dim);
    border: 1px solid var(--border);
    font-family: 'Barlow Condensed', sans-serif;
  }
  /* 4. Nachname grösser + Vorname heller & grösser */
  .nm-text .sn { font-weight: 800; font-size: 17px; line-height: 1.2; }
  .nm-text .fn { font-size: 14px; color: #9aa8cc; font-weight: 500; margin-top: 1px; }

  /* SLOT */
  .slot { display: flex; flex-direction: column; gap: 3px; min-height: 0; }

  /* BADGE */
  .badge {
    flex: 1;
    border-radius: 7px;
    padding: 6px 11px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative; overflow: hidden;
    min-height: 0;
  }
  .badge::after { content:''; position:absolute; inset:0; background:rgba(255,255,255,.06); border-radius:inherit; pointer-events:none; }
  .vm .badge { border-left: 3px solid rgba(224,144,48,.6); }
  .nm .badge { border-left: 3px solid rgba(79,142,247,.6); }

  .badge-mark {
    font-size: 10px; font-weight: 800;
    letter-spacing: .1em; text-transform: uppercase;
    opacity: .85; margin-bottom: 1px;
    font-family: 'Barlow Condensed', sans-serif;
  }
  /* 1. Bezeichnung + Adresse auf einer Zeile */
  .badge-loc {
    font-size: 15px; font-weight: 700;
    line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .badge-loc .sep { opacity: .55; margin: 0 4px; font-weight: 400; }
  .badge-loc .adr { font-weight: 500; opacity: .85; }

  .badge-note { font-size: 12px; opacity: .75; margin-top: 2px; line-height: 1.3; white-space: pre-line; font-style: italic; }

  .empty { border-radius: 7px; background: rgba(255,255,255,.02); border: 1px dashed rgba(255,255,255,.05); flex: 1; }

  /* FOOTER */
  footer {
    flex-shrink: 0; padding: 6px 20px;
    font-size: 11px; color: var(--dim);
    display: flex; justify-content: space-between;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }

  /* ═══════════════════════════════════════════
     MARKIERUNG-FARBEN – exakt nach Visual Planning
     ═══════════════════════════════════════════ */
  .m-anzeichnen-lueftung    { background: #8a9400; color: #fffff0; }
  .m-anzeichnen-sanitaer    { background: #0a1a7a; color: #c8d8ff; }
  .m-arbeitspensum          { background: repeating-conic-gradient(#6600aa 0% 25%, #330066 0% 50%) 0 0 / 8px 8px; color: #f0ccff; }
  .m-arzttermin             { background: repeating-linear-gradient(0deg, #d06080 0px, #d06080 2px, #f0a0b8 2px, #f0a0b8 6px); color: #fff; }
  .m-baus-arbeiten          { background: #3a7a3a; color: #d0ffd0; }
  .m-bodenheizung           { background: #d06000; color: #fff; }
  .m-einlagen-lueftung      { background: #b0a800; color: #fffce0; }
  .m-einlagen-sanitaer      { background: #1060d0; color: #fff; }
  .m-erdsondenleitung       { background: repeating-conic-gradient(#cc0000 0% 25%, #880000 0% 50%) 0 0 / 8px 8px; color: #ffcccc; }
  .m-ferien                 { background: repeating-conic-gradient(#9900cc 0% 25%, #660088 0% 50%) 0 0 / 8px 8px; color: #f0ccff; }
  .m-fertigmontage-heizung  { background: #990000; color: #fff; }
  .m-fertigmontage-lueftung { background: #6a8a30; color: #f0ffe0; }
  .m-fertigmontage-sanitaer { background: #1c1e26; color: #fff; border: 1px solid #444; }
  .m-heizungssanierung      { background: #c05070; color: #fff; }
  .m-interner-anlass        { background: repeating-linear-gradient(45deg, #4060c0, #4060c0 4px, #6080e0 4px, #6080e0 10px); color: #fff; }
  .m-kellervert-heizung     { background: #c88080; color: #1a0000; }
  .m-kellervert-sanitaer    { background: #5090c8; color: #fff; }
  .m-kompensation           { background: repeating-linear-gradient(45deg, #505050, #505050 4px, #707070 4px, #707070 10px); color: #fff; }
  .m-krank                  { background: repeating-conic-gradient(#7700bb 0% 25%, #440077 0% 50%) 0 0 / 8px 8px; color: #f0ccff; }
  .m-kurs                   { background: repeating-linear-gradient(45deg, #207020, #207020 4px, #409040 4px, #409040 10px); color: #fff; }
  .m-lieferung              { background: repeating-linear-gradient(90deg, #cc2020, #cc2020 4px, #ee4040 4px, #ee4040 10px); color: #fff; }
  .m-militaer               { background: repeating-linear-gradient(45deg, #7a5020, #7a5020 4px, #9a7040 4px, #9a7040 10px); color: #fff; }
  .m-personalverleih        { background: #c87090; color: #fff; }
  .m-rohmontage-heizung     { background: #cc0000; color: #fff; }
  .m-rohmontage-lueftung    { background: #aaaa00; color: #1a1a00; }
  .m-rohmontage-sanitaer    { background: #2080e0; color: #fff; }
  .m-schule                 { background: repeating-linear-gradient(45deg, #cc6000, #cc6000 4px, #ee8020 4px, #ee8020 10px); color: #fff; }
  .m-service                { background: #cc007a; color: #fff; }
  .m-umbau                  { background: #1e6868; color: #c8f0f0; }
  .m-unfall                 { background: repeating-linear-gradient(45deg, #4040cc, #4040cc 4px, #6060ee 4px, #6060ee 10px); color: #fff; }
  .m-vorfabrizieren         { background: #a0dde8; color: #001a20; }
  .m-wannen-setzen          { background: #009900; color: #e0ffe0; }
  .m-wasserversorgung       { background: repeating-conic-gradient(#0044aa 0% 25%, #0066cc 0% 50%) 0 0 / 8px 8px; color: #c8e0ff; }
  .m-werkstatt              { background: #c09050; color: #1a0e00; }
  .m-zivilschutz            { background: repeating-linear-gradient(45deg, #2a3a20, #2a3a20 4px, #3a5030 4px, #3a5030 10px); color: #c8d8b0; }
  .m-default                { background: #1e3a5a; color: #b0ccee; }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="logo"><div class="dot"></div>Gebr. Estermann AG</div>
    <div class="date-block">
      <div class="woche" id="woche">–</div>
      <div class="datum" id="datum">–</div>
    </div>
    <div class="clock" id="clock">–</div>
  </header>

  <div class="col-headers">
    <div class="col-header">Mitarbeiter</div>
    <div class="col-header vm">☀ Vormittag</div>
    <div class="col-header nm">◑ Nachmittag</div>
  </div>

  <div class="table-body" id="planBody">
    <div style="display:flex;align-items:center;justify-content:center;flex:1;color:var(--dim);font-size:18px;">⏳ Wird geladen…</div>
  </div>

  <footer>
    <span id="updated">–</span>
    <span>Visual Planning · Auto-Refresh alle 5 Min.</span>
  </footer>

</div>
<script>
const JSON_URL = window.TAGESPLAN_JSON_URL
  || new URLSearchParams(location.search).get('json')
  || 'Tagesansicht.json';
const REFRESH_MS = 5 * 60 * 1000;

function getSlot(r) {
  const st = (r['Startzeit'] || '00:00').trim();
  const et = (r['Endzeit']   || '00:00').trim();
  if (st === '00:00' && et === '12:00') return 'vm';
  if (st === '12:00' && et === '00:00') return 'nm';
  return 'both';
}

function markClass(m) {
  const t = (m || '').toLowerCase().trim();
  if (t === 'anzeichnen lüftung')        return 'm-anzeichnen-lueftung';
  if (t === 'anzeichnen sanitär')        return 'm-anzeichnen-sanitaer';
  if (t.includes('arbeitspensum'))       return 'm-arbeitspensum';
  if (t === 'arzttermin')                return 'm-arzttermin';
  if (t === 'baus. arbeiten')            return 'm-baus-arbeiten';
  if (t === 'bodenheizung')             return 'm-bodenheizung';
  if (t === 'einlagen lüftung')          return 'm-einlagen-lueftung';
  if (t === 'einlagen sanitär')          return 'm-einlagen-sanitaer';
  if (t === 'erdsondenleitung')          return 'm-erdsondenleitung';
  if (t === 'ferien')                    return 'm-ferien';
  if (t === 'fertigmontage heizung')     return 'm-fertigmontage-heizung';
  if (t === 'fertigmontage lüftung')     return 'm-fertigmontage-lueftung';
  if (t === 'fertigmontage sanitär')     return 'm-fertigmontage-sanitaer';
  if (t === 'heizungssanierung')         return 'm-heizungssanierung';
  if (t === 'interner anlass')           return 'm-interner-anlass';
  if (t === 'kellerverteilung heizung')  return 'm-kellervert-heizung';
  if (t === 'kellerverteilung sanitär')  return 'm-kellervert-sanitaer';
  if (t === 'kompensation')              return 'm-kompensation';
  if (t === 'krank')                     return 'm-krank';
  if (t === 'kurs')                      return 'm-kurs';
  if (t === 'lieferung')                 return 'm-lieferung';
  if (t === 'militär')                   return 'm-militaer';
  if (t === 'personalverleih')           return 'm-personalverleih';
  if (t === 'rohmontage heizung')        return 'm-rohmontage-heizung';
  if (t === 'rohmontage lüftung')        return 'm-rohmontage-lueftung';
  if (t === 'rohmontage sanitär')        return 'm-rohmontage-sanitaer';
  if (t === 'schule')                    return 'm-schule';
  if (t === 'service')                   return 'm-service';
  if (t === 'umbau')                     return 'm-umbau';
  if (t === 'unfall')                    return 'm-unfall';
  if (t === 'vorfabrizieren')            return 'm-vorfabrizieren';
  if (t === 'wannen setzen')             return 'm-wannen-setzen';
  if (t === 'wasserversorgung')          return 'm-wasserversorgung';
  if (t.includes('werkstatt')||t.includes('lager')) return 'm-werkstatt';
  if (t === 'zivilschutz')              return 'm-zivilschutz';
  return 'm-default';
}

function badgeHtml(r) {
  const mark = (r['Markierung']  || '').trim();
  const bez  = (r['Bezeichnung'] || '').trim();
  const adr  = (r['Adresse']     || '').trim();
  let notiz  = (r['Notiz']       || '').trim();
  if (notiz.startsWith('VPEXPORT:')) notiz = '';
  const cls  = markClass(mark || notiz);

  // 1. Bezeichnung + Adresse auf einer Zeile
  const locHtml = (bez || adr)
    ? `<span class="badge-loc">
        ${bez ? x(bez) : ''}
        ${bez && adr ? `<span class="sep">·</span><span class="adr">${x(adr)}</span>` : (adr ? x(adr) : '')}
       </span>`
    : '';

  return `<div class="badge ${cls}">
    ${mark   ? `<span class="badge-mark">${x(mark)}</span>` : ''}
    ${locHtml}
    ${notiz  ? `<span class="badge-note">${x(notiz)}</span>` : ''}
  </div>`;
}

function group(records) {
  const map = new Map();
  records.forEach(r => {
    const vn = (r['Vorname'] || '').trim();
    const nn = (r['Name']    || '').trim();
    if (!vn && !nn) return;
    const key = `${nn}__${vn}`;
    if (!map.has(key)) map.set(key, { nn, vn, vm: [], nm: [] });
    const emp  = map.get(key);
    const slot = getSlot(r);
    if (slot === 'vm'   || slot === 'both') emp.vm.push(r);
    if (slot === 'nm'   || slot === 'both') emp.nm.push(r);
  });
  return [...map.values()].sort((a, b) =>
    (a.nn || a.vn).localeCompare(b.nn || b.vn, 'de'));
}

function render(records) {
  const emps = group(records);
  const body = document.getElementById('planBody');
  body.innerHTML = '';

  if (!emps.length) {
    body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;flex:1;color:var(--dim);font-size:18px;">📭 Keine Einträge für heute</div>`;
    return;
  }

  emps.forEach((emp, i) => {
    const row    = document.createElement('div');
    row.className = 'row';
    row.style.animationDelay = `${i * 25}ms`;
    const ini    = ((emp.nn?.[0]||'') + (emp.vn?.[0]||'')).toUpperCase();
    const vmHtml = emp.vm.length ? emp.vm.map(badgeHtml).join('') : `<div class="empty"></div>`;
    const nmHtml = emp.nm.length ? emp.nm.map(badgeHtml).join('') : `<div class="empty"></div>`;
    row.innerHTML = `
      <div class="name-cell">
        <div class="avatar">${x(ini)}</div>
        <div class="nm-text">
          <div class="sn">${x(emp.nn || emp.vn)}</div>
          <div class="fn">${x(emp.nn ? emp.vn : '')}</div>
        </div>
      </div>
      <div class="slot vm">${vmHtml}</div>
      <div class="slot nm">${nmHtml}</div>`;
    body.appendChild(row);
  });

  const n = new Date();
  document.getElementById('updated').textContent =
    `Aktualisiert: ${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
}

async function load() {
  try {
    const url  = JSON_URL + (JSON_URL.includes('?') ? '&' : '?') + '_t=' + Date.now();
    const res  = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    render(Array.isArray(data) ? data : []);
  } catch(err) {
    document.getElementById('planBody').innerHTML =
      `<div style="display:flex;align-items:center;justify-content:center;flex:1;color:var(--dim);font-size:16px;">⚠️ Ladefehler: ${x(err.message)}</div>`;
  }
}

function p(n) { return String(n).padStart(2,'0'); }
function x(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function tick() {
  const n = new Date();
  document.getElementById('clock').textContent = `${p(n.getHours())}:${p(n.getMinutes())}`;
}
function updateDate() {
  const d = new Date();
  const days   = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  const months = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const t = new Date(d); t.setHours(0,0,0,0);
  t.setDate(t.getDate() + 3 - (t.getDay()+6)%7);
  const w1   = new Date(t.getFullYear(), 0, 4);
  const week = 1 + Math.round(((t - w1) / 86400000 - 3 + (w1.getDay()+6)%7) / 7);
  document.getElementById('woche').textContent = `KW ${week} · ${d.getFullYear()}`;
  document.getElementById('datum').textContent  =
    `${days[d.getDay()]}, ${d.getDate()}. ${months[d.getMonth()]}`;
}

updateDate(); tick();
setInterval(tick, 1000);
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
